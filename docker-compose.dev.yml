services:
  mongo-dev:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mingle-dev-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mingle-dev-mongo:
